name: CI/CD

on:
  # CD: every merge (push) to main builds and deploys.
  push:
    branches: [main]
  # CI: pull requests into main are built to catch breakage before merging, but never deployed.
  pull_request:
    branches: [main]
  # Allow a manual re-deploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; let an in-progress deploy finish rather than cancelling it halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages has no SPA fallback: serve index.html for unknown paths so
      # refreshing /jobs/3 or /about loads the app instead of a GitHub 404.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
